<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CTS HTML5 Practice</title>

    <style>

        body{
            font-family: Arial;
            margin:20px;
        }

        #welcomeBanner{
            background-color: blue;
            color:white;
            padding:15px;
        }

        .highlight{
            background-color: yellow;
            font-weight:bold;
        }

        .gallery{
            width:200px;
            height:150px;
            border:2px solid black;
        }

        form{
            background-color: lightblue;
            padding:20px;
            width:300px;
        }

    </style>

    <script>

        function showMessage(){
            document.getElementById("msg").innerHTML =
            "Registration Successful!";
        }

        function validatePhone(){

            let phone =
            document.getElementById("phone").value;

            if(phone.length != 10){
                alert("Enter valid number");
            }
        }

        function showFee(){

            let fee =
            document.getElementById("event").value;

            document.getElementById("fee").innerHTML =
            "Event Fee: " + fee;
        }

        function enlarge(img){
            img.style.width="300px";
        }

        function countChars(){

            let text =
            document.getElementById("feedback").value;

            document.getElementById("count").innerHTML =
            "Characters: " + text.length;
        }

        function readyMessage(){

            document.getElementById("videoMsg").innerHTML =
            "Video ready to play";
        }

    </script>

</head>

<body>

    <nav>
        <a href="#home">Home</a> |
        <a href="#events">Events</a> |
        <a href="#contact">Contact</a>
    </nav>

    <hr>


    <div id="welcomeBanner">
        Welcome to Community Portal
    </div>

    <p class="highlight">
        Special Community Offer
    </p>

    <p>
        Register today and get
        <span style="color:red; font-weight:bold;">
            50% Discount
        </span>
    </p>

    <hr>


    <table border="1">

        <caption>Community Event Gallery</caption>

        <tr>

            <td>
                <img src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f"
                class="gallery">
            </td>

            <td>
                <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836"
                class="gallery">
            </td>

            <td>
                <img src="https://images.unsplash.com/photo-1517649763962-0c623066013b"
                class="gallery">
            </td>

        </tr>

    </table>

    <hr>


    <form onsubmit="showMessage(); return false;">

        <input type="text"
        placeholder="Enter Name"
        required autofocus>

        <br><br>

        <input type="email"
        placeholder="Enter Email"
        required>

        <br><br>

        <input type="date" required>

        <br><br>

        <select required>

            <option>Music</option>
            <option>Sports</option>

        </select>

        <br><br>

        <textarea
        placeholder="Enter Message"></textarea>

        <br><br>

        <button type="submit">
            Register
        </button>

        <p id="msg"></p>

    </form>

    <hr>



    Phone Number:

    <input type="text"
    id="phone"
    onblur="validatePhone()">

    <br><br>

    Select Event:

    <select id="event"
    onchange="showFee()">

        <option value="100">
            Music
        </option>

        <option value="200">
            Sports
        </option>

    </select>

    <p id="fee"></p>

    <img src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f"
    width="150"
    ondblclick="enlarge(this)">

    <br><br>

    <textarea id="feedback"
    onkeyup="countChars()"></textarea>

    <p id="count"></p>

    <hr>


    <video width="400"
    controls
    oncanplay="readyMessage()">

        <source src="https://www.w3schools.com/html/mov_bbb.mp4"
        type="video/mp4">

    </video>

    <p id="videoMsg"></p>

</body>
</html>
