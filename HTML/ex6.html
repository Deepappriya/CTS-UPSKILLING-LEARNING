<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Feedback Form</title>

    <script>

        function validatePhone() {
            let phone = document.getElementById("phone").value;

            if(phone.length != 10) {
                alert("Enter valid 10 digit number");
            }
        }

        function showFee() {
            let fee = document.getElementById("event").value;
            document.getElementById("fee").innerHTML =
                "Event Fee: " + fee;
        }

        function submitData() {
            alert("Feedback Submitted Successfully");
        }

        function enlarge(img) {
            img.style.width = "300px";
        }

        function countCharacters() {
            let text = document.getElementById("feedback").value;

            document.getElementById("count").innerHTML =
                "Characters: " + text.length;
        }

    </script>
</head>
<body>

    Phone Number:
    <input type="text" id="phone"
           onblur="validatePhone()">

    <br><br>

    Select Event:
    <select id="event" onchange="showFee()">
        <option value="100">Music</option>
        <option value="200">Sports</option>
        <option value="300">Workshop</option>
    </select>
</html>
